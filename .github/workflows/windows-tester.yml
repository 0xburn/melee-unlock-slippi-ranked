name: Windows tester
on:
  push:
    branches: [build/windows-ranked-551ed9c2]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned native sources
        run: |
          git submodule update --init --depth 1 sourceport/extern/melee
          python tools/prepare_native_sources.py
      - name: Build Windows native host
        shell: pwsh
        run: |
          $gen = (Resolve-Path windows-build/headers).Path
          foreach ($file in @('guest_sources.cmake','function_names.cpp','gecko_data.cpp')) { New-Item -Type File "$gen/$file" }
          $dxc = (Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/dxc.exe' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          cmake -S . -B wh -A x64 -DMELEE_BUILD_EXPERIMENTAL_PORT=ON -DMELEE_SQUAD_STRIKE=OFF "-DPORT_GEN=$gen" "-DMELEE_DXC_EXECUTABLE=$dxc"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build wh --config Release --target melee_source --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: windows-fork-binaries
          path: |
            wh/port/Release/*

      - uses: actions/download-artifact@v4
        with:
          name: windows-fork-game
          path: game
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45080013116
      - name: Package and run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.5 --repo Hero88go/melee-unlocked -p '*win64.zip'
          $hostDir = (Resolve-Path 'wh/port/Release').Path
          $gameDir = (Get-ChildItem game -Recurse -Filter melee_game.dll).DirectoryName
          python windows-build/package.py --host "$hostDir" --game "$gameDir" --assets MeleeUnlocked-1.0.5-win64.zip --out Melee-Unlocked-Windows-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive Melee-Unlocked-Windows-x64.zip -DestinationPath test
          Set-Location test/Melee-Unlocked-Windows
          $version = & .\melee_source.exe --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '1.0.5') { throw "Windows host startup failed ($LASTEXITCODE, $version)" }
          python -c "import ctypes, pathlib; ctypes.WinDLL(str(pathlib.Path('melee_game.dll').resolve()))"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: tested-Windows-zip
          path: Melee-Unlocked-Windows-x64.zip

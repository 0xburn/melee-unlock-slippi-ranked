name: Build Windows release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned native sources
        run: |
          git submodule update --init --depth 1 sourceport/extern/melee
          python tools/prepare_native_sources.py
      - name: Prepare graphics runtimes from the matching upstream release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.5 --repo Hero88go/melee-unlocked -p '*win64.zip'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive MeleeUnlocked-1.0.5-win64.zip -DestinationPath upstream
          $src = 'upstream/MeleeUnlocked-1.0.5'
          $deps = 'port/third_party'
          foreach ($dest in @('streamline/bin/x64','xess/bin','librashader/bin','dxc/bin')) {
            New-Item -Force -ItemType Directory "$deps/$dest" | Out-Null
          }
          Copy-Item "$src/sl.*.dll","$src/nvngx_dlss.dll","$src/nvngx_dlssg.dll" "$deps/streamline/bin/x64"
          if (Test-Path "$src/libxess.dll") { Copy-Item "$src/libxess.dll" "$deps/xess/bin" }
          Copy-Item "$src/librashader.dll" "$deps/librashader/bin"
          Copy-Item "$src/dxcompiler.dll","$src/dxil.dll" "$deps/dxc/bin"
      - name: Build Windows native host
        shell: pwsh
        run: |
          $gen = (Resolve-Path windows-build/headers).Path
          foreach ($file in @('guest_sources.cmake','function_names.cpp','gecko_data.cpp')) { New-Item -Type File "$gen/$file" }
          $dxc = (Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/dxc.exe' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          cmake -S . -B wh -A x64 -DMELEE_BUILD_EXPERIMENTAL_PORT=ON -DMELEE_REQUIRE_STREAMLINE=ON -DMELEE_SQUAD_STRIKE=OFF "-DPORT_GEN=$gen" "-DMELEE_DXC_EXECUTABLE=$dxc"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build wh --config Release --target melee_unlocked melee_source --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: windows-fork-binaries
          path: |
            wh/port/Release/*

  game:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned native sources
        run: |
          git submodule update --init --depth 1 sourceport/extern/melee
          python tools/prepare_native_sources.py
      - name: Build x64 game library
        shell: pwsh
        run: |
          $env:PATH = "C:/msys64/ucrt64/bin;$env:PATH"
          cmake -S sourceport/game -B wg -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DMELEE_SQUAD_STRIKE=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build wg --target melee_game --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: windows-fork-game
          path: |
            wg/melee_game.dll
            wg/melee_game.snapexcl

  package:
    needs: [build, game]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-fork-game
          path: game
      - uses: actions/download-artifact@v4
        with:
          name: windows-fork-binaries
          path: host
      - name: Package and run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.5 --repo Hero88go/melee-unlocked -p '*win64.zip'
          $hostDir = (Get-ChildItem host -Recurse -Filter melee_source.exe).DirectoryName
          $gameDir = (Get-ChildItem game -Recurse -Filter melee_game.dll).DirectoryName
          python windows-build/package.py --host "$hostDir" --game "$gameDir" --assets MeleeUnlocked-1.0.5-win64.zip --out Melee-Unlocked-Windows-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive Melee-Unlocked-Windows-x64.zip -DestinationPath test
          Set-Location test/Melee-Unlocked-Windows
          foreach ($name in @('sl.interposer.dll','sl.common.dll','sl.dlss.dll','nvngx_dlss.dll','sl.dlss_g.dll','nvngx_dlssg.dll','sl.reflex.dll')) {
            if (!(Test-Path $name)) { throw "Missing graphics runtime: $name" }
          }
          $version = & .\melee_source.exe --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '1.0.5') { throw "Windows startup failed ($LASTEXITCODE, $version)" }
          python -c "import ctypes, pathlib; ctypes.WinDLL(str(pathlib.Path('melee_game.dll').resolve()))"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:MELEE_LAUNCHER_TEST = '1'
          $env:MELEE_LAUNCHER_TEST_CAPTURE_MS = '500'
          $launcher = Start-Process .\MeleeUnlockedLauncher.exe -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              if ($launcher.HasExited) { throw "Launcher exited before showing its window" }
              if (Test-Path launcher-capture.bmp) { break }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path launcher-capture.bmp)) { throw "Launcher did not draw the Play page" }
          } finally {
            if (!$launcher.HasExited) { Stop-Process -Id $launcher.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Melee-Unlocked-Windows-x64
          path: Melee-Unlocked-Windows-x64.zip
